<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛍️ Beauty Store</h1>

        <button id="cartBtn">
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </header>

    <main>
        <section class="hero">
            <h2>Discover Your Favorites</h2>
            <p>Simple products. Great prices. Easy shopping.</p>
        </section>

        <section class="products-section">
            <h2>Our Products</h2>
            <div id="productList" class="product-grid"></div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">

            <button id="closeModal" class="close-btn">&times;</button>

            <h2>🛒 Shopping Cart</h2>

            <div id="cartItems"></div>

            <div class="cart-total">
                <strong>Total: ₹<span id="cartTotal">0</span></strong>
            </div>

            <button id="checkoutBtn" class="checkout-btn">
                Checkout
            </button>

        </div>
    </div>

    <!-- Checkout Preview Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content checkout-box">

            <button id="closeCheckout" class="close-btn">&times;</button>

            <h2>🎉 Checkout Preview</h2>

            <p>Your order is ready!</p>

            <div id="checkoutDetails"></div>

            <h3>
                Total: ₹<span id="checkoutTotal">0</span>
            </h3>

            <button id="placeOrderBtn" class="checkout-btn">
                Place Order
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
